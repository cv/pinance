name: pi Assistant

# Mention @pi in an issue, pull request, or comment to run a durable pi agent with pit
# (https://github.com/cv/pi-action, https://github.com/cv/pit). With trust_project, pit loads the
# data functions in .pi/functions (fd.*, eq.*, market.*) and pi-action loads the skills in .pi/skills.
# Only @cv can start pi.
#
# Repository secrets:
#   NVIDIA_API_KEY              key for the NVIDIA inference endpoint (the model below)
#   FINANCIAL_DATASETS_API_KEY  and/or EQUIBLES_API_KEY: a key for one data provider is enough.
#                               The functions read them in the shell and never print them.
# Repository variable (optional):
#   PINANCE_PROVIDER            financialdatasets or equibles, when both keys are set

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  issue_comment:
    types: [created, edited] # edited: a box ticked on a question from a pi-durable extension
  pull_request_review_comment:
    types: [created]

jobs:
  pi-response:
    # Only @cv, so nobody else's run gets the secrets. pi-action checks allowed_users too.
    # @pi requests, /answer replies, and edits of pi's questions (not other edited comments).
    if: >-
      github.actor == 'cv' && (
      (github.event.action == 'edited' && contains(github.event.comment.body, '<!-- pi-action:question'))
      || (github.event.action != 'edited' && (contains(github.event.comment.body || github.event.issue.body || github.event.pull_request.body || '', '@pi')
      || contains(github.event.comment.body || '', '/answer'))))
    runs-on: ubuntu-latest
    # One run per issue or pull request at a time.
    concurrency:
      group: pi-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push code and refs/pi/threads/*
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Run pi-action
        uses: cv/pi-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The same NVIDIA endpoint and model as local pi (provider "inference.nvidia" in
          # ~/.pi/agent/models.json), so no Anthropic key is needed.
          provider: nvidia
          model: aws/anthropic/bedrock-claude-opus-5-5
          provider_base_url: https://inference-api.nvidia.com
          provider_api: anthropic-messages
          provider_api_key: NVIDIA_API_KEY # the name of the environment variable below
          model_name: Opus 5.5 (NVIDIA)
          model_reasoning: true
          model_input: text,image
          model_context_window: 1050000
          model_max_tokens: 128000
          compat_force_adaptive_thinking: true
          thinking_level: high
          extensions: |
            github:cv/pit#v0.37.0
          # Only @cv can start pi, so the repository's .pi/functions and .pi/skills are code we
          # already run.
          allowed_users: cv
          trust_project: true
          worktree_snapshot_exclude: .env*
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FINANCIAL_DATASETS_API_KEY: ${{ secrets.FINANCIAL_DATASETS_API_KEY }}
          EQUIBLES_API_KEY: ${{ secrets.EQUIBLES_API_KEY }}
          PINANCE_PROVIDER: ${{ vars.PINANCE_PROVIDER }}
